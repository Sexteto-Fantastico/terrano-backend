services:
  terrano-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: terrano-api
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      NODE_ENV: production
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET (min. 32 random characters)}
      FRONTEND_URL: ${FRONTEND_URL:?Set FRONTEND_URL}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@terrano.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD for the initial administrator}
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-false}
      COOKIE_SAMESITE: ${COOKIE_SAMESITE:-strict}
      TRUST_PROXY: ${TRUST_PROXY:-}
      DB_PATH: /app/data/database.sqlite
      UPLOAD_DIR: /app/data/uploads
      SMTP_HOST: mailhog
      SMTP_PORT: 1025
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      EMAIL_FROM: no-reply@terrano.com.br
    volumes:
      - terrano-data:/app/data
    restart: unless-stopped
    networks:
      - terrano-network

  mailhog:
    image: mailhog/mailhog
    container_name: terrano-mailhog
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"
    restart: unless-stopped
    command: >
      MailHog
      -auth-file=/mailhog/auth.txt
    volumes:
      - ./mailhog.auth.txt:/mailhog/auth.txt
    networks:
      - terrano-network

volumes:
  terrano-data:

networks:
  terrano-network:
    name: terrano-network
    driver: bridge
