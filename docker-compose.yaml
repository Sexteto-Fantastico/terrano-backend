services:
  terrano-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: terrano-api
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      NODE_ENV: production
      JWT_SECRET: asedsadsaeweew
      DB_PATH: /app/data/database.sqlite
    volumes:
      - terrano-data:/app/data
    restart: unless-stopped
    networks:
      - terrano-network

volumes:
  terrano-data:

networks:
  terrano-network:
    name: terrano-network
    driver: bridge
